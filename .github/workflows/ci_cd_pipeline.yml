name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - files
  pull_request:
    branches:
      - main
      - files

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io

    - name: Build Docker Image
      run: |
        docker build -t rahilshah800/my-model:latest .

    - name: Run tests
      run: |
        python -m unittest tests/test_ml_pipeline.py

    - name: Push Docker image to Docker Hub
      if: github.ref == 'refs/heads/files'  # Only push Docker image from the 'files' branch
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username rahilshah800 --password-stdin
        docker tag rahilshah800/my-model:latest rahilshah800/my-model:latest
        docker push rahilshah800/my-model:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Log in to Docker Hub
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username rahilshah800 --password-stdin

    - name: Deploy Docker container
      run: |
        docker run -d -p 8080:8080 rahilshah800/my-model: latest
