name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Docker Image
      run: |
        docker build -t rahilshah800/ml_model .


    - name: Run tests
      run: |
        python -m unittest tests/test_ml_pipeline.py
  

    - name: Push Docker image to Docker Hub
      run: |
          echo $DOCKER_PASSWORD | docker login --username rahilshah800 --password-stdin
          docker push rahilshah800/ml_model:latest
      
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Docker container
      run: |
        docker run -d -p 8080:8080 rahilshah800/ml_model
    
