name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fix containerd conflicts
      run: |
        sudo apt-get remove -y containerd containerd.io || true
        sudo apt-get update

    - name: Install Docker
      run: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sudo sh get-docker.sh

    - name: Build Docker Image
      run: |
        docker build -t rahilshah800/my-model .

    - name: Run tests
      run: |
        python -m unittest tests/test_ml_pipeline.py

    - name: Push Docker image to Docker Hub
      env:
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo $DOCKER_PASSWORD | docker login --username rahilshah800 --password-stdin
        docker tag rahilshah800/my-model:latest rahilshah800/my-model:latest
        docker push rahilshah800/my-model:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy Docker container
      run: |
        docker run -d -p 8080:8080 rahilshah800/my-model
